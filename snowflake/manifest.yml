manifest_version: 2

type: DCM_PROJECT

#---------------------------------------------

default_target: PROD

targets:
  DEV:
    account_identifier: XTQKXIY-FXB49207
    project_name: ollo_metadata.dcm.ollo_project_dev
    project_owner: SYSADMIN
    templating_config: DEV
  PROD:
    account_identifier: XTQKXIY-FXB49207
    project_name: ollo_metadata.dcm.ollo_project
    project_owner: SYSADMIN
    templating_config: PROD

#---------------------------------------------

templating:
  defaults:
    project_owner_role: SYSADMIN
    wh_size: "SMALL"
    schema_name: "raw"
    databases:
      - "atlassian_delta_share"
      - "atlassian_jira"
    jira_database: "atlassian_jira"

  configurations:
    DEV:
      wh_size: "X-SMALL"
      teams:
        - name: "DEV_TEAM"
          data_retention_days: 1
          add_employees: TRUE
    PROD:
      wh_size: "SMALL"
      teams:
        - name: "PROD_TEAM"
          data_retention_days: 7
          add_employees: TRUE
