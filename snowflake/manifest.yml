manifest_version: 2

type: DCM_PROJECT

#---------------------------------------------

default_target: PROD

targets:
  DEV:
    account_identifier: XTQKXIY-PROD
    project_name: ollo_metadata.dcm.ollo_project_dev
    project_owner: sysadmin
    templating_config: DEV
  PROD:
    account_identifier: XTQKXIY-PROD
    project_name: ollo_metadata.dcm.ollo_project
    project_owner: sysadmin
    templating_config: PROD

#---------------------------------------------

templating:
  defaults:
    project_owner_role: sysadmin
    wh_size: "X-SMALL"
    schema_name: "raw"
    databases:
      - "atlassian_delta_share"
      - "atlassian_jira"
    jira_database: "atlassian_jira"

  configurations:
    DEV:
      wh_size: "X-SMALL"
    PROD:
      wh_size: "X-SMALL"
